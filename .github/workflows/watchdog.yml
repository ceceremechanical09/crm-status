name: CRM watchdog

# Every 5 minutes (GitHub may add a few minutes under load). Checks the live
# CRM from outside Vercel and Supabase, restarts hung Supabase services when
# that is the safe fix, emails the owner, and commits docs/status.json for the
# public status page (GitHub Pages serves /docs).
# Secrets: SUPABASE_ACCESS_TOKEN, RESEND_API_KEY, ALERT_TO.
# First scheduled run pushed Oct 6 2026; GitHub may take a while to start a new schedule.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = log only, no restart, no email, no commit"
        default: "0"

concurrency:
  group: crm-watchdog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the CRM
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node watchdog.mjs
      - name: Publish status
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        run: |
          set -euo pipefail
          git config user.name "crm-watchdog"
          git config user.email "crm-watchdog@users.noreply.github.com"
          # Commit when something material changed (state, message, incidents,
          # restarts) or once an hour as a heartbeat so "last report" stays fresh.
          MATERIAL=$(git diff -U0 -- docs/status.json | grep -cE '^[+-]\s+"(state|message|since|restarts|incidents|lastAlertAt)"' || true)
          LASTC=$(node -e "const s=require('./docs/status.json');console.log(s.lastCommittedCheck||'')")
          AGE=$(node -e "const l=process.argv[1];console.log(l?Math.round((Date.now()-new Date(l))/60000):9999)" "$LASTC")
          if [ "$MATERIAL" = "0" ] && [ "$AGE" -lt 60 ]; then
            git checkout -- docs/status.json
            echo "no material change; heartbeat in $((60-AGE)) min"
            exit 0
          fi
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('docs/status.json'));s.lastCommittedCheck=s.lastCheck;fs.writeFileSync('docs/status.json',JSON.stringify(s,null,2)+'\n')"
          STATE=$(node -e "const s=require('./docs/status.json');console.log(s.state)")
          git add docs/status.json
          git commit -m "status: $STATE $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push origin HEAD:main
